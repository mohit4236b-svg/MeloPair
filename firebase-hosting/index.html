<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <title>MeloPair · Sign in</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; background: #101114; color: #f5f2ef; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 15%, #302522 0, #171719 46%, #101114 78%); }
    main { width: min(100%, 420px); padding: 38px; border: 1px solid rgba(255,255,255,.10); border-radius: 28px; background: rgba(25,25,28,.86); box-shadow: 0 28px 90px rgba(0,0,0,.45); text-align: center; }
    .mark { width: 54px; height: 54px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 18px; color: #231916; background: linear-gradient(140deg,#f5c4ad,#ee9b7f); font-size: 26px; font-weight: 800; }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.04em; }
    p { margin: 12px 0 26px; color: rgba(245,242,239,.64); line-height: 1.55; font-size: 14px; }
    button { width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: center; gap: 12px; border: 0; border-radius: 15px; background: #f5f2ef; color: #171719; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .18s ease, background .18s ease; }
    button:hover { background: #fff; transform: translateY(-1px); }
    button:disabled { opacity: .6; cursor: wait; transform: none; }
    .google-g { width: 19px; height: 19px; font: 700 18px Arial,sans-serif; color: #4285f4; }
    #status { min-height: 22px; margin: 18px 0 0; font-size: 12px; color: rgba(245,242,239,.58); }
    #status.error { color: #ff9d91; }
    .return-to-app { display: block; margin-top: 14px; color: #f5c4ad; font-size: 13px; font-weight: 700; text-decoration: none; }
    .return-to-app:hover { color: #fff; text-decoration: underline; }
    .return-to-app[hidden] { display: none; }
    small { display:block; margin-top: 22px; color: rgba(245,242,239,.42); font-size: 11px; line-height: 1.45; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♪</div>
    <h1>Sign in to MeloPair</h1>
    <p>Use your Google account to sign in. Your music library stays on this device.</p>
    <button id="googleSignIn" type="button"><span class="google-g" aria-hidden="true">G</span><span>Continue with Google</span></button>
    <div id="status" role="status" aria-live="polite"></div>
    <a id="returnToApp" class="return-to-app" href="#" hidden>Return to MeloPair</a>
    <small>Authentication is provided by Firebase. MeloPair does not receive your Google password.</small>
  </main>
  <script type="module" src="/auth.js?v=20261118-session-handoff"></script>
</body>
</html>
